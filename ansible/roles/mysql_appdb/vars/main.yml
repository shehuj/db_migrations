---
# SQL executed via community.mysql.mysql_query (PyMySQL) — no mysql CLI needed,
# so it works with the ansible-core-only venv and any client version. Statements
# are idempotent (IF NOT EXISTS / ON DUPLICATE KEY UPDATE) and ordered so that
# foreign keys resolve (customers, products, then orders).
appdb_schema_statements:
  - >-
    CREATE TABLE IF NOT EXISTS customers (
      id INT AUTO_INCREMENT PRIMARY KEY,
      full_name VARCHAR(120) NOT NULL,
      email VARCHAR(160) NOT NULL UNIQUE,
      created_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP
    ) ENGINE = InnoDB
  - >-
    CREATE TABLE IF NOT EXISTS products (
      id INT AUTO_INCREMENT PRIMARY KEY,
      sku VARCHAR(40) NOT NULL UNIQUE,
      name VARCHAR(160) NOT NULL,
      price_cents INT NOT NULL
    ) ENGINE = InnoDB
  - >-
    CREATE TABLE IF NOT EXISTS orders (
      id INT AUTO_INCREMENT PRIMARY KEY,
      customer_id INT NOT NULL,
      product_id INT NOT NULL,
      quantity INT NOT NULL DEFAULT 1,
      ordered_at TIMESTAMP NOT NULL DEFAULT CURRENT_TIMESTAMP,
      CONSTRAINT uq_orders_customer_product UNIQUE (customer_id, product_id),
      CONSTRAINT fk_orders_customer FOREIGN KEY (customer_id) REFERENCES customers (id),
      CONSTRAINT fk_orders_product FOREIGN KEY (product_id) REFERENCES products (id)
    ) ENGINE = InnoDB

appdb_seed_statements:
  - >-
    INSERT INTO customers (full_name, email) VALUES
      ('Ada Lovelace', 'ada@example.com'),
      ('Alan Turing', 'alan@example.com'),
      ('Grace Hopper', 'grace@example.com'),
      ('Katherine Johnson', 'katherine@example.com')
    ON DUPLICATE KEY UPDATE full_name = VALUES(full_name)
  - >-
    INSERT INTO products (sku, name, price_cents) VALUES
      ('SKU-001', 'Mechanical Keyboard', 12900),
      ('SKU-002', 'Noise-Cancelling Headphones', 24900),
      ('SKU-003', 'USB-C Hub', 4900),
      ('SKU-004', '4K Monitor', 39900)
    ON DUPLICATE KEY UPDATE name = VALUES(name)
  - >-
    INSERT INTO orders (customer_id, product_id, quantity) VALUES
      (1, 1, 1),
      (1, 3, 2),
      (2, 2, 1),
      (3, 4, 1),
      (4, 1, 1)
    ON DUPLICATE KEY UPDATE quantity = VALUES(quantity)
