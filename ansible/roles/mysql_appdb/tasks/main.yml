---
# Configure and seed a MySQL database. Connection parameters (login_host/port)
# are supplied by group_vars per tier: dev connects to the public endpoint,
# prod connects to the local end of the SSM port-forward tunnel.

- name: Assert connection + credentials are provided
  ansible.builtin.assert:
    that:
      - mysql_login_host | length > 0
      - mysql_login_password | length > 0
    fail_msg: >-
      mysql_login_host and RDS_ADMIN_PASSWORD must be set. For dev export
      DEV_DB_HOST from the Terraform output; for prod open the SSM tunnel first.

- name: Ensure the application database exists
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present
    login_host: "{{ mysql_login_host }}"
    login_port: "{{ mysql_login_port }}"
    login_user: "{{ mysql_login_user }}"
    login_password: "{{ mysql_login_password }}"

- name: Create the least-privilege application user
  community.mysql.mysql_user:
    name: "{{ app_db_user }}"
    password: "{{ app_db_password }}"
    host: "%"
    priv: "{{ db_name }}.*:SELECT,INSERT,UPDATE,DELETE"
    state: present
    login_host: "{{ mysql_login_host }}"
    login_port: "{{ mysql_login_port }}"
    login_user: "{{ mysql_login_user }}"
    login_password: "{{ mysql_login_password }}"

# mysql_query runs through PyMySQL (not the mysql CLI), so it works with the
# ansible-core-only venv and is unaffected by the client's auth-plugin support.
- name: Load the application schema
  community.mysql.mysql_query:
    login_host: "{{ mysql_login_host }}"
    login_port: "{{ mysql_login_port }}"
    login_user: "{{ mysql_login_user }}"
    login_password: "{{ mysql_login_password }}"
    login_db: "{{ db_name }}"
    query: "{{ appdb_schema_statements }}"
  when: load_schema | bool

- name: Load the sample seed data
  community.mysql.mysql_query:
    login_host: "{{ mysql_login_host }}"
    login_port: "{{ mysql_login_port }}"
    login_user: "{{ mysql_login_user }}"
    login_password: "{{ mysql_login_password }}"
    login_db: "{{ db_name }}"
    query: "{{ appdb_seed_statements }}"
  when: load_seed_data | bool
