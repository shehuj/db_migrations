---
# Dynamic inventory: discovers the source host by the tags Terraform applies.
# Requires AWS credentials in the environment (the CI role provides these).
plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

filters:
  tag:Role: source-database
  instance-state-name: running

hostnames:
  - ip-address      # public IP for SSH from CI
  - private-ip-address

compose:
  ansible_host: public_ip_address

keyed_groups:
  - key: tags.Project
    prefix: project
  - key: tags.Environment
    prefix: env
