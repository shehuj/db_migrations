---
# Dynamic inventory for local/manual runs. Discovers the source host by the tags
# Terraform applies and exposes it by instance ID (the aws_ssm connection plugin
# targets the instance ID, and the host has no public IP). CI instead passes
# `-i "<instance-id>,"` from the Terraform output.
plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

filters:
  tag:Role: source-database
  instance-state-name: running

hostnames:
  - instance-id

keyed_groups:
  - key: ec2_tags.Project
    prefix: project
  - key: ec2_tags.Environment
    prefix: env
