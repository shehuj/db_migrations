---
# Two logical database targets. Ansible itself always runs locally
# (connection: local); the community.mysql modules open a TCP connection to the
# RDS endpoint named by mysql_login_host (see group_vars/).
#
#   dev  -> the public dev DB, connected to directly
#   prod -> the private prod DB, connected to via the SSM port-forward tunnel
#
# Run one tier at a time with --limit:
#   ansible-playbook configure.yml --limit dev
#   ansible-playbook configure.yml --limit prod
all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    dev:
      hosts:
        dev_db:
    prod:
      hosts:
        prod_db:
