---
# Connection: the source host is private and keyless — reach it over SSM.
# The playbook is run with `-i "<instance-id>,"`, so inventory_hostname is the
# EC2 instance ID that the aws_ssm plugin targets.
ansible_connection: community.aws.aws_ssm
ansible_aws_ssm_bucket_name: "{{ lookup('env', 'SSM_TRANSFER_BUCKET') | default('bathbucket31', true) }}"
ansible_aws_ssm_region: "{{ lookup('env', 'AWS_REGION') | default('us-east-1', true) }}"
ansible_python_interpreter: /usr/bin/python3

# Secrets are passed at runtime via `--extra-vars` from CI secrets, never
# committed:
#   mysql_source_app_password   # application admin password
#   mysql_source_dms_password   # DMS replication user password
#
# Override role defaults here if you need environment-specific values, e.g.:
# mysql_source_database: appdb
