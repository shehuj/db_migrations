name: Deploy

# Provisions the pipeline: dev/source RDS (public), prod/target RDS (private),
# SSM bastion, and DMS. It does NOT load data or run the migration — devs load
# the dev DB (scripts/setup_source_db.sh), and the Migrate flow moves the data.
on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment tier"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: "1.9.5"
  ENVIRONMENT: ${{ github.event.inputs.environment || 'dev' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  TF_BACKEND_BUCKET: ${{ secrets.TF_BACKEND_BUCKET }}
  TF_BACKEND_TABLE: ${{ secrets.TF_BACKEND_TABLE }}
  TF_VAR_rds_admin_password: ${{ secrets.RDS_ADMIN_PASSWORD }}
  TF_VAR_dms_db_password: ${{ secrets.DMS_DB_PASSWORD }}

jobs:
  preflight:
    name: Preflight (verify configuration)
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      TF_BACKEND_BUCKET: ${{ secrets.TF_BACKEND_BUCKET }}
      TF_BACKEND_TABLE: ${{ secrets.TF_BACKEND_TABLE }}
      DMS_DB_PASSWORD: ${{ secrets.DMS_DB_PASSWORD }}
      RDS_ADMIN_PASSWORD: ${{ secrets.RDS_ADMIN_PASSWORD }}
    steps:
      - name: Verify required secrets are configured
        run: |
          missing=()
          for name in AWS_ROLE_ARN TF_BACKEND_BUCKET TF_BACKEND_TABLE \
                      DMS_DB_PASSWORD RDS_ADMIN_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            exit 1
          fi
          echo "All required secrets are present."

  plan:
    name: Terraform Plan
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    outputs:
      env: ${{ env.ENVIRONMENT }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=db-migrations/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_TABLE}" \
            -backend-config="encrypt=true"
      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan -var-file="environments/${ENVIRONMENT}.tfvars"
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}
          path: terraform/tfplan
          retention-days: 5

  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest
    environment: ${{ needs.plan.outputs.env }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${TF_BACKEND_BUCKET}" \
            -backend-config="key=db-migrations/${ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${TF_BACKEND_TABLE}" \
            -backend-config="encrypt=true"
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ env.ENVIRONMENT }}
          path: terraform
      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
      - name: Show connection outputs
        run: |
          echo "dev DB (public):  $(terraform output -raw dev_db_endpoint)"
          echo "prod DB (private): $(terraform output -raw prod_db_address)"
          echo "bastion:          $(terraform output -raw bastion_instance_id)"
          echo "Next: run scripts/setup_source_db.sh, load data, then the Migrate workflow."
