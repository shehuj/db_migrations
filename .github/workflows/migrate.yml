name: Migrate

# Manually triggered database migration. Tests the DMS endpoint connections,
# starts the replication task for the chosen environment, then reports status
# and table statistics. Deploy (infra + source DB config) must already be done.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which database to migrate into"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: migrate-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  PREFIX: aws-db-migration-${{ github.event.inputs.environment }}

jobs:
  migrate:
    name: Start migration (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }} # required-reviewer gate
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve DMS ARNs
        id: arns
        run: |
          task=$(aws dms describe-replication-tasks \
            --query "ReplicationTasks[?ReplicationTaskIdentifier=='${PREFIX}-task'].ReplicationTaskArn" --output text)
          ri=$(aws dms describe-replication-instances \
            --query "ReplicationInstances[?ReplicationInstanceIdentifier=='${PREFIX}-dms'].ReplicationInstanceArn" --output text)
          src=$(aws dms describe-endpoints \
            --query "Endpoints[?EndpointIdentifier=='${PREFIX}-source'].EndpointArn" --output text)
          tgt=$(aws dms describe-endpoints \
            --query "Endpoints[?EndpointIdentifier=='${PREFIX}-target'].EndpointArn" --output text)
          if [ -z "$task" ] || [ "$task" = "None" ]; then
            echo "::error::No replication task '${PREFIX}-task' found. Run Deploy first."
            exit 1
          fi
          echo "task=$task" >> "$GITHUB_OUTPUT"
          echo "ri=$ri"     >> "$GITHUB_OUTPUT"
          echo "src=$src"   >> "$GITHUB_OUTPUT"
          echo "tgt=$tgt"   >> "$GITHUB_OUTPUT"

      - name: Test endpoint connections
        env:
          RI: ${{ steps.arns.outputs.ri }}
          SRC: ${{ steps.arns.outputs.src }}
          TGT: ${{ steps.arns.outputs.tgt }}
        run: |
          for ep in "$SRC" "$TGT"; do
            aws dms test-connection --replication-instance-arn "$RI" --endpoint-arn "$ep" >/dev/null || true
          done
          echo "Waiting for connection tests..."
          for i in $(seq 1 18); do
            statuses=$(aws dms describe-connections \
              --filters "Name=endpoint-arn,Values=${SRC},${TGT}" \
              --query 'Connections[].Status' --output text)
            echo "[$i] $statuses"
            if ! echo "$statuses" | grep -qiE 'testing'; then break; fi
            sleep 10
          done
          if aws dms describe-connections --filters "Name=endpoint-arn,Values=${SRC},${TGT}" \
              --query 'Connections[].Status' --output text | grep -qi 'failed'; then
            echo "::error::An endpoint connection test failed. See DMS console for details."
            aws dms describe-connections --filters "Name=endpoint-arn,Values=${SRC},${TGT}" \
              --query 'Connections[].[EndpointIdentifier,Status,LastFailureMessage]' --output table
            exit 1
          fi

      - name: Start replication task
        env:
          TASK: ${{ steps.arns.outputs.task }}
        run: |
          status=$(aws dms describe-replication-tasks --filters "Name=replication-task-arn,Values=${TASK}" \
                   --query 'ReplicationTasks[0].Status' --output text)
          echo "current task status: $status"
          if [ "$status" = "running" ] || [ "$status" = "starting" ]; then
            echo "Task already running — reporting status only."
          else
            aws dms start-replication-task --replication-task-arn "${TASK}" \
              --start-replication-task-type start-replication >/dev/null
            echo "start requested."
          fi

      - name: Report status + table statistics
        env:
          TASK: ${{ steps.arns.outputs.task }}
        run: |
          for i in $(seq 1 12); do
            status=$(aws dms describe-replication-tasks --filters "Name=replication-task-arn,Values=${TASK}" \
                     --query 'ReplicationTasks[0].{S:Status,P:ReplicationTaskStats.FullLoadProgressPercent}' --output text)
            echo "[$i] status/pct: $status"
            echo "$status" | grep -qiE 'stopped|failed|running' && [ "$i" -ge 2 ] && break
            sleep 10
          done
          echo "=== table statistics ==="
          aws dms describe-table-statistics --replication-task-arn "${TASK}" \
            --query 'TableStatistics[].{Table:TableName,State:TableState,FullLoad:FullLoadRows,Inserts:Inserts,Updates:Updates,Deletes:Deletes}' \
            --output table || echo "(no statistics yet)"
